<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>egui-prism gallery</title>
    <link data-trunk rel="rust" data-bin="egui-prism-gallery" />
    <link data-trunk rel="copy-file" href="../LICENSE" />
    <link data-trunk rel="copy-file" href="../THIRD_PARTY_NOTICES.md" />
    <style>
      html, body { margin: 0; height: 100%; background: #202020; color: #eee; }
      canvas { display: block; width: 100%; height: 100%; }
      #status { position: absolute; inset: 2rem; font: 1rem system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <canvas id="gallery" aria-label="egui-prism engineering gallery"></canvas>
    <div id="status" role="status">Loading the gallery…</div>
    <noscript>This gallery requires JavaScript and WebAssembly.</noscript>
    <script>
      window.addEventListener("unhandledrejection", () => {
        const status = document.getElementById("status");
        if (status) status.textContent = "The gallery could not load. Check the browser console and reload.";
      });
    </script>
  </body>
</html>
