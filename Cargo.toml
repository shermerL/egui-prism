[workspace]
members = ["crates/egui-prism", "crates/egui-prism-wgpu", "gallery"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/shermerL/egui-prism"

[workspace.dependencies]
egui = { version = "=0.37.0", default-features = false }
egui-prism = { path = "crates/egui-prism" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

[profile.dev]
debug = 0
incremental = false

[profile.release]
opt-level = 2
