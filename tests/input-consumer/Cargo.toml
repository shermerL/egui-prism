[package]
name = "input-consumer"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
egui = { version = "=0.37.0", default-features = false }
egui-prism = { path = "../../crates/egui-prism" }
egui-winit = { version = "=0.37.0", default-features = false, features = ["x11", "wayland"] }
egui-wgpu = { version = "=0.37.0", default-features = false }
egui_system_font_provider = { version = "=0.37.0", optional = true }

[features]
system-fonts = ["dep:egui_system_font_provider"]

[patch.crates-io]
egui = { path = "../../vendor/egui" }
