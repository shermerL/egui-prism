name: Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

# Supersede old PR heads without cancelling checks for separate main commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@d9186cbdca7adedf113a159fa91f725a27866771 # v31
      - name: Repository policy and pinned CSS reference
        run: nix develop --command quest gate python3 scripts/check.py --policy-only
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Linux development dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxkbcommon-dev libwayland-dev libvulkan-dev mesa-vulkan-drivers
      - name: Install pinned Rust tools
        run: rustup show active-toolchain
      - name: Cache Cargo dependency downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
          key: cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Locked native build and CPU checks
        env:
          EGUI_PRISM_BUILD_ID: ${{ github.sha }}
        run: python scripts/check.py --cargo-only
      - name: GPU contracts on Mesa software Vulkan
        if: runner.os == 'Linux'
        shell: bash
        run: |
          icds=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          test -f "${icds[0]}"
          export VK_ICD_FILENAMES="${icds[0]}"
          export XDG_RUNTIME_DIR="${RUNNER_TEMP}"
          cargo test --locked -p egui-prism-wgpu tests::current_frame_producers_cleanup_and_revocation -- --ignored --exact --nocapture
          cargo test --locked -p egui-prism-gallery -- --ignored --nocapture
          cargo test --locked --manifest-path examples/settings/Cargo.toml --target-dir target/settings-example --bin prism-settings-example tests::current_frame_image_reaches_group_and_overlay -- --ignored --exact --nocapture
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gallery-${{ runner.os }}-${{ github.sha }}
          path: |
            target/debug/egui-prism-gallery
            target/debug/egui-prism-gallery.exe
            LICENSE
            THIRD_PARTY_NOTICES.md
          if-no-files-found: error
