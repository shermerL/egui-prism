name: Check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  policy:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@d9186cbdca7adedf113a159fa91f725a27866771 # v31
      - name: Repository policy and pinned CSS reference
        run: nix develop --command quest gate python3 scripts/check.py --policy-only
  native:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Linux development dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxkbcommon-dev libwayland-dev libvulkan-dev
      - name: Install pinned Rust tools
        run: rustup show active-toolchain
      - name: Locked native build and CPU checks
        env:
          EGUI_PRISM_BUILD_ID: ${{ github.sha }}
        run: python scripts/check.py --cargo-only
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gallery-${{ runner.os }}-${{ github.sha }}
          path: |
            target/debug/egui-prism-gallery
            target/debug/egui-prism-gallery.exe
            LICENSE
            THIRD_PARTY_NOTICES.md
          if-no-files-found: error
